[project]
name = "dietly-fetcher"
version = "1.0.0"
description = "Scrape diet prices from dietly.pl for a given Polish city"
requires-python = ">=3.11"
dependencies = [
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "tqdm>=4.67.3",
]

[project.scripts]
dietly-fetcher = "dietly_fetcher:main"

[tool.uv]
package = true
